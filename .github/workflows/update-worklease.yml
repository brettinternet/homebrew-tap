name: Update Worklease formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without a v prefix; latest when omitted
        required: false
        type: string
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-worklease-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            tag="v${REQUESTED_VERSION#v}"
          else
            tag=$(gh release view --repo brettinternet/worklease --json tagName --jq .tagName)
          fi
          gh release view "$tag" --repo brettinternet/worklease >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/worklease-release"
          gh release download "$RELEASE_TAG" \
            --repo brettinternet/worklease \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP/worklease-release"
      - name: Update formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ruby .github/scripts/update-worklease-formula.rb "$VERSION" "$RUNNER_TEMP/worklease-release/checksums.txt"
      - name: Commit update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Formula/worklease.rb; then
            echo "Formula already targets Worklease $VERSION"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/worklease.rb
          git commit -m "worklease v$VERSION"
          git push
