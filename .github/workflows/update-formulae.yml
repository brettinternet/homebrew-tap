name: Update formulae

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update formulae from latest releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          updated=$(ruby .github/scripts/update-formulae.rb)
          if [ -z "$updated" ]; then
            echo "Formulae already target the latest releases"
            exit 0
          fi
          {
            echo "formulae=$(printf '%s\n' "$updated" | cut -d' ' -f1 | paste -sd' ' -)"
            echo "summary=$(printf '%s\n' "$updated" | sed 's/ / v/' | paste -sd',' - | sed 's/,/, /g')"
          } >> "$GITHUB_OUTPUT"
      - name: Check updated formulae
        if: steps.update.outputs.formulae
        env:
          FORMULAE: ${{ steps.update.outputs.formulae }}
        run: |
          # The runner image ships Homebrew off PATH. setup-homebrew would tap the
          # pushed revision instead of this checkout.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # shellcheck disable=SC2086 # FORMULAE is a space-separated list of names.
          .github/scripts/check-homebrew-tap.sh brettinternet/tap $FORMULAE
      - name: Commit updates
        if: steps.update.outputs.formulae
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula
          git commit -m "update formulae: $SUMMARY"
          git push
